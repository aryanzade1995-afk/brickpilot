name: Build Formstead 100 facade views

on:
  workflow_dispatch:
  push:
    branches:
      - assets/formstead-facades-100-views
    paths:
      - .github/workflows/build_formstead_facades.yml
      - formstead_facades/generate_pack.py

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out dedicated assets branch
        uses: actions/checkout@v4
        with:
          ref: assets/formstead-facades-100-views
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install procedural-render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow trimesh

      - name: Ensure outward-facing mesh surfaces are rendered
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("formstead_facades/generate_pack.py")
          content=p.read_text(encoding="utf-8")
          original="normal=normal/norm"
          if original in content:
              p.write_text(content.replace(original,"normal=-normal/norm"),encoding="utf-8")
          PY

      - name: Generate ten models and one hundred views
        run: |
          python formstead_facades/generate_pack.py

      - name: Verify complete pack
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("formstead_facades")
          images=list((root/"images_100").glob("*.jpg"))
          models=list((root/"glb_models_10").glob("*.glb"))
          sheets=list((root/"contact_sheets_10").glob("*.jpg"))
          seeds=json.loads((root/"design_seeds_manifest.json").read_text())
          assert len(images)==100, f"Need 100 images, got {len(images)}"
          assert len(models)==10, f"Need 10 models, got {len(models)}"
          assert len(sheets)==10, f"Need 10 contact sheets, got {len(sheets)}"
          assert len(seeds["designs"])==10
          assert all(p.stat().st_size>1000 for p in images+models)
          print("Verified:",len(images),"JPEGs,",len(models),"GLBs,",len(sheets),"contact sheets")
          PY

      - name: Commit generated assets only to the dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formstead_facades/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "assets: publish 100 facade views and 10 seeded GLB models"
            git push origin HEAD:refs/heads/assets/formstead-facades-100-views
          fi

      - name: Publish backup downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formstead-100-Views-10-GLB-Models
          path: |
            formstead_facades/images_100/
            formstead_facades/glb_models_10/
            formstead_facades/contact_sheets_10/
            formstead_facades/design_seeds_manifest.json
            formstead_facades/FORMSTEAD_DESIGN_PROMPTS.md
          retention-days: 30
